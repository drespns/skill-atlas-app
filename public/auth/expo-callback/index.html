<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volviendo a Finanzas…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
        text-align: center;
      }
      a { color: #a5b4fc; font-weight: 600; }
      .box { max-width: 28rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { margin: 0.5rem 0; line-height: 1.45; color: #94a3b8; font-size: 0.95rem; }
      code { font-size: 0.75rem; color: #cbd5e1; word-break: break-all; }
      .btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #4f46e5;
        color: #fff !important;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Acceso listo</h1>
      <p id="status">Abriendo Expo Go…</p>
      <p id="hint">Si no vuelve sola, pulsa el botón.</p>
      <p><a class="btn" id="deeplink" href="#">Abrir app</a></p>
      <p><code id="targetPreview"></code></p>
    </div>
    <script>
      (function () {
        var search = new URLSearchParams(window.location.search);
        var code = search.get("code");
        var hash = window.location.hash || "";
        var parts = window.location.pathname.split("/").filter(Boolean);
        // auth / expo-callback / exp / host / port
        // auth / expo-callback / native
        var target = "skillatlas-gastos://auth/callback";
        var i = parts.indexOf("expo-callback");
        if (i >= 0 && parts[i + 1] === "exp" && parts[i + 2]) {
          var host = parts[i + 2];
          var port = parts[i + 3] || "8081";
          target = "exp://" + host + ":" + port + "/--/auth/callback";
        } else if (i >= 0 && parts[i + 1] === "native") {
          target = "skillatlas-gastos://auth/callback";
        } else if (search.get("return")) {
          try {
            target = decodeURIComponent(search.get("return"));
          } catch (e) {
            target = search.get("return");
          }
        }

        if (code && target.indexOf("code=") === -1) {
          target += (target.indexOf("?") >= 0 ? "&" : "?") + "code=" + encodeURIComponent(code);
        }
        search.forEach(function (v, k) {
          if (k === "return" || k === "code") return;
          if (target.indexOf(k + "=") >= 0) return;
          target +=
            (target.indexOf("?") >= 0 ? "&" : "?") +
            encodeURIComponent(k) +
            "=" +
            encodeURIComponent(v);
        });
        if (hash && hash.length > 1) {
          target = target.split("#")[0] + hash;
        }

        var a = document.getElementById("deeplink");
        if (a) a.setAttribute("href", target);
        var preview = document.getElementById("targetPreview");
        if (preview) preview.textContent = target;
        var status = document.getElementById("status");
        var ok = target.indexOf("exp://") === 0 || target.indexOf("skillatlas-gastos://") === 0;
        if (status) {
          status.textContent = ok
            ? "Abriendo la app…"
            : "No se pudo calcular el enlace. Reinicia sesión desde Expo Go.";
        }

        if (ok) {
          try {
            window.location.replace(target);
          } catch (e) {}
          setTimeout(function () {
            try {
              window.location.href = target;
            } catch (e2) {}
          }, 350);
        }
      })();
    </script>
  </body>
</html>
