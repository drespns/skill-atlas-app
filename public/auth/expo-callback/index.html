<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volviendo a Finanzas…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
        text-align: center;
      }
      a { color: #a5b4fc; font-weight: 600; }
      .box { max-width: 28rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { margin: 0.5rem 0; line-height: 1.45; color: #94a3b8; font-size: 0.95rem; }
      .btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #4f46e5;
        color: #fff !important;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Acceso listo</h1>
      <p id="status">Abriendo Expo Go…</p>
      <p>Si no vuelve sola, pulsa el botón (en Expo Go el enlace es <code>exp://</code>, no la app instalada).</p>
      <p><a class="btn" id="deeplink" href="#">Abrir app</a></p>
    </div>
    <script>
      (function () {
        var search = new URLSearchParams(window.location.search);
        var ret = search.get("return");
        var code = search.get("code");
        var hash = window.location.hash || "";

        var target = "skillatlas-gastos://auth/callback";
        if (ret) {
          try {
            target = decodeURIComponent(ret);
          } catch (e) {
            target = ret;
          }
        }

        // Pasar code / tokens al deep link de Expo
        if (code && target.indexOf("code=") === -1) {
          target += (target.indexOf("?") >= 0 ? "&" : "?") + "code=" + encodeURIComponent(code);
        }
        // Otros params de Supabase (p. ej. error)
        search.forEach(function (v, k) {
          if (k === "return" || k === "code") return;
          if (target.indexOf(k + "=") >= 0) return;
          target += (target.indexOf("?") >= 0 ? "&" : "?") + encodeURIComponent(k) + "=" + encodeURIComponent(v);
        });
        if (hash && hash.length > 1) {
          target = target.split("#")[0] + hash;
        }

        var a = document.getElementById("deeplink");
        if (a) a.setAttribute("href", target);

        var status = document.getElementById("status");
        if (status) {
          status.textContent = ret
            ? "Abriendo Expo…"
            : "Falta el parámetro return. Vuelve a iniciar sesión desde la app.";
        }

        // Intento automático (Expo Go abre exp://…)
        try {
          window.location.replace(target);
        } catch (e) {}
        setTimeout(function () {
          try {
            window.location.href = target;
          } catch (e2) {}
        }, 300);
      })();
    </script>
  </body>
</html>
